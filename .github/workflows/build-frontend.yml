name: Build Frontend Image

on:
  push:
    branches:
      - main
    # Path filters are not evaluated for tag pushes, so tagged releases always
    # build.
    paths:
      - "typescript/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - "frontend.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-frontend.yml"
    # Every tag builds. Path filters are not evaluated for tag pushes.
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/guru-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=match,pattern=^frontend-(v.*)$,group=1
            type=match,pattern=^(v.*)$,group=1
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repository root: `guru-frontend` builds against the Bun workspace.
          context: .
          file: ./frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
