name: Build Master Image

on:
  push:
    branches:
      - main
    # Any change that can alter the `guru-master` binary. Path filters are not
    # evaluated for tag pushes, so tagged releases always build.
    paths:
      - "bin/guru-master/**"
      - "lib/**"
      - "modules/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "master.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-master.yml"
    # Every tag builds. Path filters are not evaluated for tag pushes.
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-master-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/guru-master

jobs:
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=match,pattern=^master-(v.*)$,group=1
            type=match,pattern=^(v.*)$,group=1
            type=ref,event=tag

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./master.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=master
          cache-to: type=gha,mode=max,scope=master
