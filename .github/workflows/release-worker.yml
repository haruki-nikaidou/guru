name: Release Worker

# The data plane ships as a raw binary, not an image: `worker-v0.1.0`,
# `worker-v0.1.0-alpha`, ... Only linux/x86_64 is published.
on:
  push:
    tags:
      - "worker-v*"

permissions:
  contents: write

concurrency:
  group: release-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#worker-}"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          # Anything that is not `vX.Y.Z` (i.e. `-alpha`, `-rc.1`, ...) is a
          # GitHub pre-release.
          if [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install protobuf compiler
        # `lib/rpguru_sdk`'s build script compiles `proto/` with
        # tonic-prost-build, which shells out to `protoc`.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust toolchain
        # `rustup show` materialises the channel pinned in rust-toolchain.toml.
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup target add "$TARGET"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-worker-${{ env.TARGET }}

      - name: Build guru-worker
        run: cargo build --release --locked -p guru-worker --target "$TARGET"

      - name: Package binary
        id: package
        run: |
          set -euo pipefail
          name="guru-worker-${{ steps.version.outputs.version }}-${TARGET}"
          mkdir -p dist
          cp "target/${TARGET}/release/guru-worker" "dist/${name}"
          chmod +x "dist/${name}"
          echo "name=${name}" >>"$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: guru-worker ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/${{ steps.package.outputs.name }}
