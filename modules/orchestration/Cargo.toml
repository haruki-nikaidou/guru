[package]
name = "orchestration"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Internal
rpguru_sdk = { path = "../../lib/rpguru_sdk" }
newtype_record_id = { path = "../../lib/newtype_record_id" }
guru_worker_config = { path = "../../lib/guru_worker_config" }
auth = { path = "../auth" }

# Framework
wakuwaku = { workspace = true }
kanau = { workspace = true }
tokio = { workspace = true }

# Persistence
surrealdb = { workspace = true }
surrealdb-types = { workspace = true }
redis = { workspace = true }

# Messaging
amqprs = { workspace = true }

# gRPC / transport
tonic = { workspace = true }
tower = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# Serialization
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

# Data types
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
compact_str = { workspace = true }
smallvec = { workspace = true }

# Tracing
tracing = { workspace = true }

# Algorithm
itertools = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Streaming
tokio-stream = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
surrealdb = { workspace = true, features = ["kv-mem"] }
testcontainers-modules = { version = "0.15.0", features = ["rabbitmq"] }
tokio = { workspace = true }
